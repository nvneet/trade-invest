<header class="navbar">
  <div class="logo-section">
    <img src="assets/logo.svg" alt="Logo" class="logo" />
    <span class="brand-name">EduPlatform</span>
  </div>

  <nav class="nav-tabs">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{
      t.translate('home')
    }}</a>
    <a routerLink="/courses" routerLinkActive="active">{{ t.translate('courses') }}</a>
    <a routerLink="/my-learning" routerLinkActive="active">{{ t.translate('myLearning') }}</a>
  </nav>

  <div class="header-actions">
    <select (change)="onLangChange($event)" class="lang-select">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="bn">বাংলা</option>
    </select>

    <a routerLink="/login" class="login-icon">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </a>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
