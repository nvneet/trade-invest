<main class="courses-container">
  <h2>Explore Courses</h2>

  <form class="add-form" (ngSubmit)="addCourse()">
    <input
      [(ngModel)]="newTitle"
      name="title"
      placeholder="Course Title"
      aria-label="Course title"
    />
    <input
      [(ngModel)]="newDesc"
      name="description"
      placeholder="Description"
      aria-label="Course description"
    />
    <input
      [(ngModel)]="newPrice"
      name="price"
      type="number"
      placeholder="Price"
      aria-label="Course price"
    />
    <button type="submit">Add Course</button>
  </form>

  <!-- Carousel / Slider View (3 items visible) -->
  <div class="slider-wrapper">
    <button class="slider-btn" (click)="prevSlide()">❮</button>

    <div class="courses-track">
      <app-course-card-component
        *ngFor="let course of visibleCourses()"
        [course]="course"
        (remove)="removeCourse($event)"
      ></app-course-card-component>
    </div>

    <button class="slider-btn" (click)="nextSlide()">❯</button>
  </div>
</main>
